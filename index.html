<!Doctype HTML>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EtherealOS</title>
<style>
  :root {
    /* ui colors darkmode*/
    --primary-color-darkmode: #313338 ;
    --secondary-color-darkmode: #2b2d31; 

     /* ui colors lightmode */
    --primary-color-lightmode: #f2f3f5 ;
    --secondary-color-lightmode: #e3e5e8; 

    /* text colors darkmode*/
    --primary-text-color-darkmode: #f2f3f5;   
    --secondary-text-color-darkmode: #b5bac1; 

    /* text colors lightmode */
    --primary-text-color-lightmode: #111214;   
    --secondary-text-color-lightmode: #4e5058; 
  }
  body {
    background: var(--primary-color-darkmode);
    color: var(--primary-text-color-darkmode);
    font-family: sans-serif;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 20px;
  }
  .header-section {
  text-align: center;
}
  h1 {
     font-size:4rem;
     font-weight:500; 
     margin-bottom:12px; 
     margin-top: -16px;
     user-select: none;
  }
    h1 span {
    font-weight: 700;
    background-size: 200% 200%;
    background-position: 0% 0%;
    background-image: repeating-linear-gradient(135deg, #7c4dff 0%, #3d0190 25%, #7c4dff 50%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientMove 6s linear infinite;
    filter: drop-shadow(0 0 12px rgba(124, 77, 255, 0.6));
  }
  h2 { 
    font-size:1.65rem; 
    font-weight:400;
    margin-bottom:12px; 
  }
  p {
    font-size:0.88rem;
    color:#79808d;
    margin-bottom:44px;
  }
   .grid {
     display:grid; 
     grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));
     gap:14px;
     width: 100%;
     max-width:960px;
     margin:0 auto;
     transform: translateY(-30px);
  }
   a {
     background:rgba(255,255,255,0.02);
     border:1px solid rgba(255,255,255,0.04);
     border-radius:12px;
     padding:44px 12px; 
     color:#8c93a0;
     text-decoration:none;
     text-align: center;
     font-size:1rem;
     transition:0.15s;
  }
  
  a:hover {
     background:rgba(255,255,255,0.03);
     border-color:rgba(255,255,255,0.08); 
  }

  .logo-image {
    width: clamp(160px, 25vw, 300px); 
    height: auto; 
    user-select: none;
    -webkit-user-drag: none;
  }

  
    @keyframes gradientMove {
    0% {
      background-position: 0% 0%;
    }
    100% {
      background-position: 100% 100%;
    }
  }
</style>
</head>
<body>
  <div class="header-section">
  <div class="logo"><img class="logo-image" src="./images/logo.png"></div>
  <h1 class="ethereal-title">Ethereal <span>OS</span></h1>
  <h2>Choose your primary operating system</h2>
   <p>You can always change this later in settings.</p>
   </div>
       <div class="grid">
        <a href="#">Windows</a>
        <a href="#">MacOS</a>
        <a href="#">Linux</a>
        <a href="#">Ubuntu</a>
        <a href="#">Fedora</a>
        <a href="#">Arch Linux</a>
    </div>
</body>
</html>
</html>
