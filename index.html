<!Doctype HTML>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<title>EtherealOS</title>
<style>
  :root {
    --primary-color-darkmode: #313338;
    --secondary-color-darkmode: #2b2d31;
    --card-color-darkmode: #ffffff05;
    --card-border-darkmode: #ffffff0a;
    --card-hover-darkmode: #ffffff08;

    --primary-color-lightmode: #f2f3f5;
    --secondary-color-lightmode: #e3e5e8;
    --card-color-lightmode: #ffffffd9;
    --card-border-lightmode: #11121414;
    --card-hover-lightmode: #ffffff;

    --primary-text-color-darkmode: #f2f3f5;
    --secondary-text-color-darkmode: #b5bac1;

    --primary-text-color-lightmode: #111214;
    --secondary-text-color-lightmode: #4e5058;

  }
  body {
    background: var(--primary-color-darkmode);
    color: var(--primary-text-color-darkmode);
    font-family: sans-serif;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 20px;
    -webkit-user-select: none; 
    -ms-user-select: none;   
    user-select: none;
    -webkit-user-drag: none;
  }
  .header-section {
  text-align: center;
}
 .ethereal-title {
    filter: drop-shadow(0 0 10px rgba(242, 243, 245, 0.35));
  }
  h1 {
     font-size:4rem;
     font-weight:500; 
     margin-bottom:12px; 
     margin-top: -16px;
     user-select: none;
  }
    h1 span {
    font-weight: 700;
    background-size: 200% 200%;
    background-position: 0% 0%;
    background-image: repeating-linear-gradient(135deg, #7c4dff 0%, #3d0190 25%, #7c4dff 50%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientMove 6s linear infinite;
    filter: drop-shadow(0 0 12px rgba(124, 77, 255, 0.6));
  }
  h2 { 
    font-size:1.65rem; 
    font-weight:400;
    margin-bottom:12px; 
  }
  p {
    font-size:0.88rem;
    color:#79808d;
    margin-bottom:44px;
  }
   .grid {
     display:grid; 
     grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));
     gap:14px;
     width: 100%;
     max-width:960px;
     margin:0 auto;
     transform: translateY(-30px);
  }
   a {
     background: var(--card-color-darkmode);
     border:1px solid var(--card-border-darkmode);
     border-radius:12px;
     padding: 24px 12px;
     color: var(--secondary-text-color-darkmode);
     text-decoration:none;
     text-align: center;
     font-size:1rem;
     transition:0.15s;
     display: flex;
     flex-direction: column;
     align-items: center;
     justify-content: center;
     gap: 12px;
  }
  
  a:hover {
     background: var(--card-hover-darkmode);
     border-color: rgba(255,255,255,0.08);
  }

  a:hover .os-icon {
    opacity: 1;
  }
  .logo-image {
    width: clamp(160px, 25vw, 300px); 
    height: auto; 
    user-select: none;
    -webkit-user-drag: none;
  }
  .os-icon {
    width: 36px;
    height: 36px;
    object-fit: contain; 
    user-select: none;
    -webkit-user-drag: none;
    opacity: 0.7;
    transition: opacity 0.15s;
  }
  .themeButton {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--primary-text-color-darkmode);
    padding: 0;
    appearance: none;
    box-shadow: none;
  }
  .themeButton .icon {
    font-size: 18px;
    line-height: 1;
    transition: color 0.2s ease, transform 0.2s ease;
  }
body.light-mode {
  background: var(--primary-color-lightmode);
  color: var(--primary-text-color-lightmode);
}
body.light-mode .themeButton {
  color: var(--primary-text-color-lightmode);
}
body.light-mode a {
  background: var(--card-color-lightmode);
  border-color: var(--card-border-lightmode);
  color: var(--secondary-text-color-lightmode);
}
body.light-mode a:hover {
  background: var(--card-hover-lightmode);
  border-color: rgba(17, 18, 20, 0.12);
}

   @keyframes gradientMove {
  0% {
    background-position: 100% 100%;
  }
  100% {
    background-position: 0% 0%;
  }
}
</style>
</head>
<body>
  <button id="themeButton" class="themeButton" type="button" aria-label="Toggle theme">
  <i class="fa-solid fa-sun icon" id="themeIcon"></i>
  </button>
  <div class="header-section">
  <div class="logo"><img class="logo-image" src="./images/logo.png"></div>
  <h1 class="ethereal-title">Ethereal <span>OS</span></h1>
  <h2>Choose your desired operating system</h2>
   <p>You can always change this later in settings.</p>
   </div>
         <div class="grid">
        <a href="./windows/"><img src="./images/windows.png" class="os-icon">Windows</a>
        <a href="./macos/"><img src="./images/macos.png" class="os-icon">MacOS</a>
        <a href="./linux/"><img src="./images/linux.png" class="os-icon" >Linux</a>
        <a href="./ubuntu/"><img src="./images/ubuntu.png" class="os-icon">Ubuntu</a>
        <a href="./fedora/"><img src="./images/fedora.png" class="os-icon">Fedora</a>
        <a href="./arch-linux/"><img src="./images/arch.png" class="os-icon">Arch Linux</a>
    </div>
</body>
<script>
  const toggleBtn = document.getElementById('themeButton');
  const themeIcon = document.getElementById('themeIcon');
  
  toggleBtn.addEventListener('click', () => {
    document.body.classList.toggle('light-mode');
    if (document.body.classList.contains('light-mode')) {
      themeIcon.classList.remove('fa-sun');
      themeIcon.classList.add('fa-moon');
      themeIcon.style.color = '#111214';
    } else {
      themeIcon.classList.remove('fa-moon');
      themeIcon.classList.add('fa-sun');
      themeIcon.style.color = '#f2f3f5';
    }
  });
</script>
</html>
</html>
